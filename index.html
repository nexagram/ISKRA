<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>ИСКРА</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <svg class="spark" width="18" height="18" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
            <path d="M16 1.5 18.35 13.65 30.5 16 18.35 18.35 16 30.5 13.65 18.35 1.5 16 13.65 13.65Z" />
          </svg>
          <span>ИСКРА</span>
        </div>
        <button type="button" class="btn-icon" id="btnNew" title="Новый чат">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button type="button" class="btn-icon mobile-only" id="btnMenu" title="Меню">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title" id="topTitle">Новый разговор</div>
        <button type="button" class="btn-icon" id="btnNewMobile" title="Новый чат">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>

      <div class="thread" id="thread">
        <div class="empty" id="emptyState">
          <svg class="spark large" width="48" height="48" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
            <path d="M16 1.5 18.35 13.65 30.5 16 18.35 18.35 16 30.5 13.65 18.35 1.5 16 13.65 13.65Z" />
          </svg>
          <h1>ИСКРА</h1>
          <p>Спроси что угодно — Nemotron 3 Ultra</p>
          <div class="suggestions" id="suggestions">
            <button type="button" data-prompt="Объясни квантовую физику простыми словами">Квантовая физика</button>
            <button type="button" data-prompt="Напиши код сортировки на Python">Код на Python</button>
            <button type="button" data-prompt="Как повысить продуктивность?">Продуктивность</button>
            <button type="button" data-prompt="Расскажи о трендах в AI">Тренды AI</button>
          </div>
        </div>
      </div>

      <div class="error-bar hidden" id="errorBar"></div>

      <footer class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Напиши сообщение…" maxlength="8000"></textarea>
          <button type="button" class="send" id="btnSend" disabled title="Отправить">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
          <button type="button" class="send stop hidden" id="btnStop" title="Остановить">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
          </button>
        </div>
        <div class="composer-meta"><span id="charCount">0 / 8000</span></div>
      </footer>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
