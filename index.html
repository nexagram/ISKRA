<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>ИСКРА</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
  <div id="app" class="app">
    <button type="button" class="backdrop" id="backdrop" aria-label="Закрыть меню"></button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-brand">
          <span class="mark-box">
            <svg class="spark" width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M16 1.5 18.35 13.65 30.5 16 18.35 18.35 16 30.5 13.65 18.35 1.5 16 13.65 13.65Z"/></svg>
          </span>
          <div>
            <p class="brand-name">ИСКРА</p>
            <p class="brand-sub">ИИ-собеседник</p>
          </div>
        </div>
        <button type="button" class="icon-btn mobile-only" id="btnCloseSidebar" aria-label="Закрыть">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="sidebar-action">
        <button type="button" class="btn-new" id="btnNew">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Новый чат
        </button>
      </div>

      <div class="chat-list" id="chatList">
        <p class="list-empty" id="listEmpty">Пока нет разговоров</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button type="button" class="icon-btn mobile-only" id="btnMenu" aria-label="Открыть чаты">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-mobile-brand mobile-only">
          <svg class="spark" width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M16 1.5 18.35 13.65 30.5 16 18.35 18.35 16 30.5 13.65 18.35 1.5 16 13.65 13.65Z"/></svg>
          <span id="topTitleMobile">ИСКРА</span>
        </div>
        <p class="topbar-desktop-title desktop-only" id="topTitle">Новый разговор</p>
        <button type="button" class="icon-btn mobile-only ml-auto" id="btnNewMobile" aria-label="Новый чат">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>

      <div class="thread" id="thread"></div>

      <div class="bottom">
        <div class="bottom-inner">
          <div class="error-bar hidden" id="errorBar" role="alert">
            <span id="errorText"></span>
            <button type="button" class="link-btn" id="btnRetry">Повторить</button>
          </div>

          <form class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Спросите ИСКРУ…" maxlength="4000"></textarea>
            <div class="composer-row">
              <p class="hint" id="hint">Enter — отправить</p>
              <button type="submit" class="send-btn" id="btnSend" disabled aria-label="Отправить">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
              <button type="button" class="send-btn stop hidden" id="btnStop" aria-label="Остановить">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
              </button>
            </div>
          </form>
          <p class="disclaimer">ИСКРА может ошибаться — проверяйте важное.</p>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
